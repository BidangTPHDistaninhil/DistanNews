<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artikel - DistanNews</title>
<style>
  :root{
    --hijau: #1e6b2f;
    --hijau-tua: #144d21;
    --hijau-muda: #e8f5ea;
    --abu: #6b7280;
    --border: #e2e8e4;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family: Arial, Helvetica, sans-serif; background:#fafcfa; color:#222;}
  a{text-decoration:none;color:inherit;}

  header{background:var(--hijau); color:#fff; position:sticky; top:0; z-index:10; box-shadow:0 2px 6px rgba(0,0,0,.08);}
  .header-inner{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .logo{font-size:22px;font-weight:bold;letter-spacing:.5px;}
  .logo span{color:#c7f9cc;}
  nav a{margin-left:18px;font-size:14px;font-weight:600;opacity:.95;}
  nav a:hover{text-decoration:underline;}

  main{max-width:760px;margin:0 auto;padding:30px 20px;}

  .kategori-badge{display:inline-block;background:var(--hijau-muda);color:var(--hijau-tua);font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;text-transform:uppercase;margin-bottom:12px;}
  h1{font-size:26px;color:#1a1a1a;line-height:1.3;margin-bottom:10px;}
  .meta{font-size:13px;color:var(--abu);margin-bottom:20px;}
  .foto-utama{width:100%;max-height:420px;object-fit:cover;border-radius:10px;background:var(--hijau-muda);}
  .keterangan-foto{font-size:12px;color:var(--abu);text-align:center;margin-top:6px;margin-bottom:24px;font-style:italic;}

  .isi-berita{font-size:16px;line-height:1.8;color:#222;}
  .isi-berita p{margin-bottom:16px;}

  .sumber{margin-top:28px;padding:14px;background:#fff;border:1px solid var(--border);border-left:4px solid var(--hijau);border-radius:6px;font-size:13px;color:var(--abu);}

  .state-msg{padding:60px 10px;text-align:center;color:var(--abu);font-size:14px;}

  .kembali{display:inline-block;margin-bottom:20px;font-size:13px;font-weight:700;color:var(--hijau-tua);}

  footer{background:var(--hijau-tua);color:#e8f5ea;text-align:center;padding:20px;font-size:13px;margin-top:40px;}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">Distan<span>News</span></div>
    <nav>
      <a href="index.html">Beranda</a>
      <a href="berita.html">Semua Berita</a>
      <a href="login.html">Login Admin</a>
    </nav>
  </div>
</header>

<main id="main-artikel">
  <div class="state-msg">Memuat artikel...</div>
</main>

<footer>&copy; <span id="tahun"></span> DistanNews. Semua data bersumber dari Google Sheets melalui API resmi.</footer>

<script>
  // =====================================================
  // GANTI URL DI BAWAH INI DENGAN URL WEB APP APPS SCRIPT
  // (harus diakhiri dengan /exec)
  // =====================================================
  const API_URL = "https://script.google.com/macros/s/AKfycbwABO9Qg2xR4Z49K6mH3kjgitq1qtjGK1ZOesGxgsX40QQ82aF6UgevfWMLRO3KpiLr/exec";

  document.getElementById('tahun').textContent = new Date().getFullYear();

  function formatTanggal(iso){
    if(!iso) return '-';
    const d = new Date(iso);
    return d.toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' });
  }

  function escapeHtml(str){
    if(str===undefined || str===null) return '';
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  // Ubah isi berita (teks biasa dengan baris baru) menjadi paragraf HTML.
  function renderIsi(isi){
    if(!isi) return '';
    return String(isi)
      .split(/\n+/)
      .filter(p => p.trim() !== '')
      .map(p => `<p>${escapeHtml(p.trim())}</p>`)
      .join('');
  }

  async function muatArtikel(){
    const main = document.getElementById('main-artikel');
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const slug = params.get('slug');

    if(!id && !slug){
      main.innerHTML = `<div class="state-msg">Artikel tidak ditemukan (parameter id/slug kosong).</div>`;
      return;
    }

    const apiParams = new URLSearchParams({ action:'getDetail' });
    if(id) apiParams.set('id', id);
    if(slug) apiParams.set('slug', slug);

    try{
      const res = await fetch(`${API_URL}?${apiParams.toString()}`);
      const json = await res.json();
      if(!json.success){
        main.innerHTML = `<a class="kembali" href="berita.html">&larr; Kembali ke daftar berita</a><div class="state-msg">${escapeHtml(json.message)}</div>`;
        return;
      }
      const b = json.data;
      document.title = b.judul + ' - DistanNews';

      const foto = b.foto_utama && b.foto_utama.trim() !== ''
        ? b.foto_utama
        : 'https://placehold.co/760x420/1e6b2f/ffffff?text=DistanNews';

      main.innerHTML = `
        <a class="kembali" href="berita.html">&larr; Kembali ke daftar berita</a>
        <span class="kategori-badge">${escapeHtml(b.kategori || 'Umum')}</span>
        <h1>${escapeHtml(b.judul)}</h1>
        <div class="meta">${formatTanggal(b.tanggal_publish)} &middot; Ditulis oleh ${escapeHtml(b.penulis || '-')}</div>
        <img class="foto-utama" src="${foto}" alt="${escapeHtml(b.judul)}" onerror="this.src='https://placehold.co/760x420/1e6b2f/ffffff?text=DistanNews'">
        ${b.keterangan_foto ? `<div class="keterangan-foto">${escapeHtml(b.keterangan_foto)}</div>` : ''}
        <div class="isi-berita">${renderIsi(b.isi)}</div>
        ${b.sumber ? `<div class="sumber"><strong>Sumber:</strong> ${escapeHtml(b.sumber)}</div>` : ''}
      `;
    }catch(err){
      main.innerHTML = `<div class="state-msg">Tidak dapat terhubung ke API. Periksa API_URL dan koneksi internet.</div>`;
      console.error(err);
    }
  }

  muatArtikel();
</script>
</body>
</html>
