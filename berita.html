<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semua Berita - DistanNews</title>
<style>
  :root{
    --hijau: #1e6b2f;
    --hijau-tua: #144d21;
    --hijau-muda: #e8f5ea;
    --abu: #6b7280;
    --border: #e2e8e4;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family: Arial, Helvetica, sans-serif; background:#fafcfa; color:#222;}
  a{text-decoration:none;color:inherit;}

  header{background:var(--hijau); color:#fff; position:sticky; top:0; z-index:10; box-shadow:0 2px 6px rgba(0,0,0,.08);}
  .header-inner{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .logo{font-size:22px;font-weight:bold;letter-spacing:.5px;}
  .logo span{color:#c7f9cc;}
  nav a{margin-left:18px;font-size:14px;font-weight:600;opacity:.95;}
  nav a:hover{text-decoration:underline;}

  main{max-width:1100px;margin:0 auto;padding:30px 20px;}
  h1{font-size:22px;color:var(--hijau-tua);margin-bottom:18px;}

  .filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px;}
  .filter-bar input, .filter-bar select{
    padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;
  }
  .filter-bar input{flex:1;min-width:200px;}
  .filter-bar button{
    background:var(--hijau);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;
  }
  .filter-bar button:hover{background:var(--hijau-tua);}

  .list{display:flex;flex-direction:column;gap:16px;}
  .item{display:flex;gap:16px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px;transition:.15s;}
  .item:hover{box-shadow:0 6px 18px rgba(0,0,0,.07);}
  .item img{width:180px;height:120px;object-fit:cover;border-radius:8px;flex-shrink:0;background:var(--hijau-muda);}
  .item-body{display:flex;flex-direction:column;gap:6px;}
  .kategori-badge{align-self:flex-start;background:var(--hijau-muda);color:var(--hijau-tua);font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;}
  .item h3{font-size:17px;color:#1a1a1a;}
  .item .meta{font-size:12px;color:var(--abu);}
  .item p{font-size:13px;color:#444;line-height:1.5;}

  .state-msg{padding:40px 10px;text-align:center;color:var(--abu);font-size:14px;}

  footer{background:var(--hijau-tua);color:#e8f5ea;text-align:center;padding:20px;font-size:13px;margin-top:40px;}

  @media(max-width:560px){
    .item{flex-direction:column;}
    .item img{width:100%;height:180px;}
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">Distan<span>News</span></div>
    <nav>
      <a href="index.html">Beranda</a>
      <a href="berita.html">Semua Berita</a>
      <a href="login.html">Login Admin</a>
    </nav>
  </div>
</header>

<main>
  <h1>Semua Berita</h1>

  <div class="filter-bar">
    <input type="text" id="input-cari" placeholder="Cari judul berita...">
    <select id="select-kategori">
      <option value="">Semua Kategori</option>
      <option value="Tanaman Pangan">Tanaman Pangan</option>
      <option value="Hortikultura">Hortikultura</option>
      <option value="Perkebunan">Perkebunan</option>
      <option value="Peternakan">Peternakan</option>
      <option value="Teknologi Pertanian">Teknologi Pertanian</option>
      <option value="Kebijakan">Kebijakan</option>
      <option value="Umum">Umum</option>
    </select>
    <button id="btn-cari">Cari</button>
  </div>

  <div class="list" id="list-berita">
    <div class="state-msg">Memuat berita...</div>
  </div>
</main>

<footer>&copy; <span id="tahun"></span> DistanNews. Semua data bersumber dari Google Sheets melalui API resmi.</footer>

<script>
  // =====================================================
  // GANTI URL DI BAWAH INI DENGAN URL WEB APP APPS SCRIPT
  // (harus diakhiri dengan /exec)
  // =====================================================
  const API_URL = "https://script.google.com/macros/s/AKfycbwABO9Qg2xR4Z49K6mH3kjgitq1qtjGK1ZOesGxgsX40QQ82aF6UgevfWMLRO3KpiLr/exec";

  document.getElementById('tahun').textContent = new Date().getFullYear();

  function formatTanggal(iso){
    if(!iso) return '-';
    const d = new Date(iso);
    return d.toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' });
  }

  function escapeHtml(str){
    if(str===undefined || str===null) return '';
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function renderItem(b){
    const foto = b.foto_utama && b.foto_utama.trim() !== ''
      ? b.foto_utama
      : 'https://placehold.co/300x200/1e6b2f/ffffff?text=DistanNews';
    return `
      <a class="item" href="artikel.html?slug=${encodeURIComponent(b.slug || '')}">
        <img src="${foto}" alt="${escapeHtml(b.judul)}" loading="lazy" onerror="this.src='https://placehold.co/300x200/1e6b2f/ffffff?text=DistanNews'">
        <div class="item-body">
          <span class="kategori-badge">${escapeHtml(b.kategori || 'Umum')}</span>
          <h3>${escapeHtml(b.judul)}</h3>
          <div class="meta">${formatTanggal(b.tanggal_publish)} &middot; ${escapeHtml(b.penulis || '')}</div>
          <p>${escapeHtml(b.ringkasan || '')}</p>
        </div>
      </a>`;
  }

  async function muatBerita(){
    const listEl = document.getElementById('list-berita');
    const q = document.getElementById('input-cari').value.trim();
    const kategori = document.getElementById('select-kategori').value;

    listEl.innerHTML = `<div class="state-msg">Memuat berita...</div>`;

    const params = new URLSearchParams({ action:'getList' });
    if (q) params.set('q', q);
    if (kategori) params.set('kategori', kategori);

    try{
      const res = await fetch(`${API_URL}?${params.toString()}`);
      const json = await res.json();
      if(!json.success){
        listEl.innerHTML = `<div class="state-msg">Gagal memuat berita: ${escapeHtml(json.message)}</div>`;
        return;
      }
      const data = json.data || [];
      if(data.length === 0){
        listEl.innerHTML = `<div class="state-msg">Tidak ada berita yang cocok.</div>`;
        return;
      }
      listEl.innerHTML = data.map(renderItem).join('');
    }catch(err){
      listEl.innerHTML = `<div class="state-msg">Tidak dapat terhubung ke API. Periksa API_URL dan koneksi internet.</div>`;
      console.error(err);
    }
  }

  document.getElementById('btn-cari').addEventListener('click', muatBerita);
  document.getElementById('select-kategori').addEventListener('change', muatBerita);
  document.getElementById('input-cari').addEventListener('keydown', function(e){
    if(e.key === 'Enter') muatBerita();
  });

  muatBerita();
</script>
</body>
</html>
